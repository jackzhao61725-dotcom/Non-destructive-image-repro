name: Public reproduction checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run bounded public example
        run: python scripts/run_public_example.py

      - name: Verify bundled evidence
        run: python scripts/verify_bundled_evidence.py

      - name: Verify dissertation figures
        run: python scripts/render_public_figures.py --check-only
