name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Validate forward-model contract
        run: python scripts/reproduce_forward_model.py --validate-only

      - name: Validate inference contract
        run: python scripts/reproduce_inference.py --validate-only

      - name: Check deterministic reference
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_reference.py

      - name: Check deterministic reference including inference
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_reference.py --include-inference
