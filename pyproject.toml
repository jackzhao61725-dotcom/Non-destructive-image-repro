[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equilibrium-dispersive-imaging-reproduction"
version = "1.0.0rc1"
description = "Reproduction code for equilibrium-conditioned dispersive imaging of a dipolar condensate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.18.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
