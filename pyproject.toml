[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "non-destructive-image-model"
version = "0.3.0"
description = "Simulation and inference tools for dispersive imaging of dipolar erbium condensates"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Yifeng Zhao"},
]
dependencies = [
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/jackzhao61725-dotcom/Non-destructive-image-repro"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["isolated_non_destructive_image"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
